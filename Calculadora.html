<html>

    <head>

        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Calculadora</title>

        <style>

            body{
                background-color: #DDDD;
            }

            table{
                font-size: 12px;
                width: 300px;
                height: 300px;
                border: 2px solid black;
            }

            td{
                width: 50px;
                height: 50px;
            }

            table input[type="button"]{
                width: 100%;
                height: 100%;
                font-size: 20px;
                font-weight: bold;
                cursor: pointer;
            }

            .center{
                display: flex;
                justify-content: center;
                align-items: center;    
                height: 100vh;  
            }

        </style>

        <script>

            function digitar(valor){

                var display = document.getElementById("display");

                if(valor == "C"){

                    display.value = "";

                }else if(valor == "="){

                    display.value = eval(display.value.replace("x", "*").replace("^", "**").replace("√", "Math.sqrt").replace("mod", "%").replace("÷", "/"));

                }else if(valor == "apagar"){

                    display.value = display.value.slice(0, -1);
                
                }else if(valor == "√"){

                    display.value += "√(";
                
                    
                }else{

                    var ehOperador = (valor == "+" || valor == "-" || valor == "x" || valor == "÷" || valor == "^" || valor == "%");
                    var ultimoCaractere = display.value.charAt(display.value.length - 1);
                    var ehNumero = !isNaN(ultimoCaractere) || ultimoCaractere == "(" || ultimoCaractere == ")";

                    if(!ehOperador) {
                        display.value += valor;
                    }else{
                        if(display.value.length > 0 && ehNumero){
                            display.value += valor;
                        }
                    }

                }

            }

        </script>

    </head>


    <body>

        <h1 style="text-align: center;">Calculadora</h1>

        <div class="center">

            <table>

                <tr>

                    <td colspan="5" style= "text-align:center;">

                        <input type="text" id="display" readonly style= "width:100%; height: 30px;">

                    </td>
                </tr>
                
                <tr>

                    <td><input type="button" value="C" onclick="digitar('C')"></td>
                    <td><input type="button" value="÷" onclick="digitar('÷')"></td>
                    <td><input type="button" value="x" onclick="digitar('x')"></td>
                    <td><input type="button" value="^" onclick="digitar('^')"></td>
                    <td><input type="button" value="-" onclick="digitar('-')"></td>
                    

                </tr>

                <tr>

                    <td><input type="button" value="1" onclick="digitar('1')"></td>
                    <td><input type="button" value="2" onclick="digitar('2')"></td>
                    <td><input type="button" value="3" onclick="digitar('3')"></td>
                    <td style="font-size: 1px"><input type="button" value="mod" onclick="digitar('mod')"></td>
                    <td><input type="button" value="+" onclick="digitar('+')"></td>

                </tr>

                <tr>
    
                    <td><input type="button" value="4" onclick="digitar('4')"></td>
                    <td><input type="button" value="5" onclick="digitar('5')"></td>
                    <td><input type="button" value="6" onclick="digitar('6')"></td>
                    <td><input type="button" value="√" onclick="digitar('√')"></td>
                    <td><input type="button" value="." onclick="digitar('.')"></td>
                </tr>

                <tr>
    
                    <td><input type="button" value="7" onclick="digitar('7')"></td>
                    <td><input type="button" value="8" onclick="digitar('8')"></td>
                    <td><input type="button" value="9" onclick="digitar('9')"></td>
                    <td rowspan="2" style="text-align: center; font-size: 30px"><input type="button" value="⌫" onclick="digitar('apagar')"></td>
                    <td rowspan="2" style="text-align: center; font-size: 30px"><input type="button" value="=" onclick="digitar('=')"></td>

                </tr>

                <tr>
                    
                    <td><input type="button" value="0" onclick="digitar('0')"></td>
                    <td><input type="button" id="parenteses" value="(" onclick="digitar('(')"></td>
                    <td><input type="button" id="parenteses" value=")" onclick="digitar(')')"></td>
                    
                </tr>

            </table>

        </div>

    </body>

</html>
